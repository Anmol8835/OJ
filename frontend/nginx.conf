server {
    listen 80;

    # Where the built static files live (copied in from the build stage).
    root /usr/share/nginx/html;
    index index.html;

    # Single-Page-App routing: if nginx can't find the requested file or
    # directory, fall back to index.html so React Router handles the route.
    location / {
        try_files $uri $uri/ /index.html;
    }
}
